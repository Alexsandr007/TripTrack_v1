# docker-compose.yml
services:
  # PostgreSQL Database
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: triptrack
      POSTGRES_USER: triptrack_user
      POSTGRES_PASSWORD: triptrack_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triptrack_user -d triptrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  # docker-compose.yml
  backend:
    build: .
    environment:
      - DEBUG=False
      - POSTGRES_DB=triptrack
      - POSTGRES_USER=triptrack_user
      - POSTGRES_PASSWORD=triptrack_password
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - CORS_ALLOWED_ORIGINS=http://frontend:80,http://localhost:8080
    volumes:
      - .:/app
      - ./media:/app/media  # Важно: монтируем папку media
      - ./staticfiles:/app/staticfiles  # И статические файлы
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python wait_for_db.py &&
            python manage.py makemigrations --noinput &&
            python manage.py migrate --noinput &&
            python manage.py collectstatic --noinput &&
            daphne TripTrack.asgi:application --bind 0.0.0.0 --port 8000"

  # Vue.js Frontend
  frontend:
    build: ../frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    environment:
      - VUE_APP_API_URL=http://localhost:8000/api

volumes:
  postgres_data: